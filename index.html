<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LumiVizStack — Coming Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="LumiVizStack – Visualize JSON data beautifully. Coming soon." />

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      --accent: #00e5ff;
      --glass: rgba(255, 255, 255, 0.08);
      --text-light: #eaf6ff;
      --text-muted: #a9c4d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-light);
      overflow: hidden;
    }

    .container {
      max-width: 720px;
      width: 90%;
      padding: 3rem 2.5rem;
      background: var(--glass);
      backdrop-filter: blur(14px);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      animation: fadeUp 1.2s ease forwards;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid rgba(0, 229, 255, 0.4);
      border-radius: 999px;
      margin-bottom: 1.2rem;
    }

    h1 {
      font-size: clamp(2.2rem, 4vw, 3rem);
      margin-bottom: 0.6rem;
      letter-spacing: -0.02em;
    }

    h1 span {
      color: var(--accent);
      text-shadow: 0 0 18px rgba(0, 229, 255, 0.6);
    }

    p {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .divider {
      width: 80px;
      height: 3px;
      background: var(--accent);
      margin: 0 auto 2rem auto;
      border-radius: 2px;
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.8);
    }

    .footer {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2rem;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* subtle animated glow background */
    .glow {
      position: absolute;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(0,229,255,0.25), transparent 70%);
      filter: blur(60px);
      animation: float 8s ease-in-out infinite;
    }

    .glow.one {
      top: 10%;
      left: 15%;
    }

    .glow.two {
      bottom: 10%;
      right: 15%;
      animation-delay: 3s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-25px);
      }
    }
  </style>
</head>
<body>
  <div class="glow one"></div>
  <div class="glow two"></div>

  <main class="container">
    <div class="badge">Coming Soon</div>

    <h1><span>LumiVizStack</span></h1>

    <div class="divider"></div>

    <p>
      A powerful platform to transform raw JSON data into
      <strong>beautiful visual cards and intelligent graphs</strong>.
      Paste your data. We’ll handle the visuals.
    </p>

    <div class="footer">
      © 2026 LumiVizStack · Built with React, Node.js & AI
    </div>
  </main>
</body>
</html>
